services:
  mongodb:
    image: mongo:7.0
    container_name: mongo-mundial
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=password123
      - MONGO_INITDB_DATABASE=MundialDB
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
